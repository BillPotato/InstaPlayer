services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Optional fallback downloader (lossy, YouTube-sourced) for when SpotiFLAC's
  # proxy sources are all down. Disabled unless you opt in — see "Spooty
  # fallback" in the README. Build the image yourself from your Spooty fork:
  #   docker build -t spooty:local /path/to/your/spooty/checkout
  # Then run with: docker compose --profile spooty up --build
  spooty:
    image: spooty:local
    environment:
      DOWNLOADS_PATH: ./downloads
      FORMAT: flac # must match SPOOTY_FORMAT in the backend's .env
      REDIS_RUN: "true"
      SPOTIFY_CLIENT_ID: ${SPOOTY_SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOOTY_SPOTIFY_CLIENT_SECRET}
    restart: unless-stopped
    profiles: ["spooty"]
